<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户菜单视觉增强 Demo</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/styles_user_menu_enhanced.css">
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">智能OnCall助手</h2>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <div style="padding: 40px; text-align: center;">
                <h1 style="font-size: 32px; margin-bottom: 16px;">用户菜单视觉增强 Demo</h1>
                <p style="color: #5f6368; font-size: 16px;">点击左下角用户按钮查看增强后的菜单效果</p>
            </div>
        </main>
    </div>

    <!-- 左下角用户入口（增强版） -->
    <div class="user-account" id="userAccount">
        <button class="user-account-btn" id="userAccountBtn" type="button" aria-haspopup="menu">
            <span class="user-avatar" id="userAvatar">铲</span>
            <span class="user-name" id="userName">demo_user</span>
        </button>

        <!-- 增强版菜单 -->
        <div class="user-account-menu" id="userAccountMenu" role="menu">
            <!-- 账户组 -->
            <div class="user-menu-group">账户</div>

            <button type="button" class="user-menu-item" id="profileMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">个人资料</span>
            </button>

            <button type="button" class="user-menu-item" id="permissionsMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">我的权限</span>
            </button>

            <div class="user-menu-divider"></div>

            <!-- 功能组 -->
            <div class="user-menu-group">功能</div>

            <button type="button" class="user-menu-item" id="fileManagerMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke="currentColor" stroke-width="2"/>
                        <path d="M13 2v7h7" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">文件管理</span>
            </button>

            <button type="button" class="user-menu-item" id="databaseCatalogMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="12" cy="5" rx="9" ry="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 5v14c0 1.657 4.03 3 9 3s9-1.343 9-3V5" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 12c0 1.657 4.03 3 9 3s9-1.343 9-3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">数据库能力</span>
            </button>

            <button type="button" class="user-menu-item" id="executionDashboardMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                        <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                        <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                        <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">执行看板</span>
            </button>

            <div class="user-menu-divider"></div>

            <!-- 管理组（仅 admin 可见） -->
            <div class="user-menu-group">管理</div>

            <button type="button" class="user-menu-item admin" id="adminConsoleMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 1v6m0 6v6M23 12h-6m-6 0H1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M18.36 5.64l-4.24 4.24m0 4.24l4.24 4.24M5.64 5.64l4.24 4.24m0 4.24l-4.24 4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">管理后台</span>
            </button>

            <div class="user-menu-divider"></div>

            <!-- 退出 -->
            <button type="button" class="user-menu-item danger" id="logoutMenuItem">
                <span class="user-menu-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="user-menu-item-text">退出登录</span>
            </button>
        </div>
    </div>

    <script>
        // 菜单开关逻辑
        const userAccountBtn = document.getElementById('userAccountBtn');
        const userAccountMenu = document.getElementById('userAccountMenu');

        userAccountBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userAccountMenu.classList.toggle('active');
        });

        // 点击菜单外关闭
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-account')) {
                userAccountMenu.classList.remove('active');
            }
        });

        // 菜单项点击提示
        document.querySelectorAll('.user-menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const text = e.currentTarget.querySelector('.user-menu-item-text').textContent;
                alert(`点击了：${text}`);
                userAccountMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
