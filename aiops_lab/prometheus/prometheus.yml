global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: data-sync-service
    static_configs:
      - targets:
          - data-sync-service:8000

  - job_name: order-service
    static_configs:
      - targets:
          - order-service:8000

  - job_name: inventory-service
    static_configs:
      - targets:
          - inventory-service:8000
